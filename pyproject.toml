[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "badgepy"
description = "Generate GitHub-style SVG badges locally: a maintained, drop-in fork of pybadges with CI report and preset badges"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
authors = [
    { name = "Brian Quinlan", email = "brian@sweetapp.com" },
    { name = "Xianpeng Shen", email = "xianpeng.shen@gmail.com" }
]
keywords = ["github", "gh-badges", "badge", "shield", "status", "pybadges"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
dependencies = [
    "Jinja2>=3,<4",
    "requests>=2.22.0,<3",
    "filetype>=1.2.0,<2.0.0"
]

[project.optional-dependencies]
pil-measurement = [
    "Pillow>=6,<13"
]
dev = [
    "Flask>=2.0",
    "fonttools>=3.26",
    "nox",
    "Pillow>=5",
    "pytest>=3.6",
    "pytest-cov>=4.0",
    "xmldiff>=2.4"
]

[project.urls]
homepage = "https://github.com/shenxianpeng/badgepy"
documentation = "https://github.com/shenxianpeng/badgepy#readme"
source = "https://github.com/shenxianpeng/badgepy"
tracker = "https://github.com/shenxianpeng/badgepy/issues"
changelog = "https://github.com/shenxianpeng/badgepy/blob/main/CHANGELOG.md"
funding = "https://github.com/sponsors/shenxianpeng"

[project.scripts]
badgepy = "badgepy.__main__:main"

[tool.setuptools]
packages = ["badgepy", "badgepy.parsers"]

[tool.setuptools_scm]
# It would be nice to include the commit hash in the version, but that
# can't be done in a PEP 440-compatible way.
version_scheme= "no-guess-dev"
# Test PyPI does not support local versions.
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools.package-data]
badgepy = ["badge-template-full.svg", "default-widths.json", "py.typed"]

[tool.ruff]
# Keep the hand-written Python examples in Markdown (quoting style, aligned
# trailing comments) as they are; only format the Python sources.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pin the rule set so that newer ruff releases don't silently widen it.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["badgepy"]
branch = true

[tool.coverage.report]
# The whole package is covered; keep it that way: the nox coverage session
# (run in CI) fails below 100% lines and branches.
fail_under = 100
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
]
